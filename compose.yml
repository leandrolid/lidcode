services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - auth-server
  auth-server:
    build:
      context: .
      dockerfile: apps/auth-server/Dockerfile
    ports:
      - "${AUTH_PORT:-3334}:3334"
    command:
      - sh
      - -c
      - node apps/auth-server/dist/commands/migrate.js && exec node apps/auth-server/dist/index.js
    environment:
      - NODE_ENV=development
      - PORT=3334
      - AUTH_PUBLIC_ORIGIN=${AUTH_PUBLIC_ORIGIN:-http://localhost:3334}
      - AUTH_DATABASE_URL=postgresql://auth:${AUTH_DATABASE_PASSWORD:-replace-with-local-database-password}@auth-postgres:5432/auth
      - AUTH_DATABASE_SSL=false
      - AUTH_SECRET
      - AUTH_GOOGLE_CLIENT_ID
      - AUTH_GOOGLE_CLIENT_SECRET
      - AUTH_GITHUB_CLIENT_ID
      - AUTH_GITHUB_CLIENT_SECRET
      - AUTH_RESEND_API_KEY
      - AUTH_EMAIL_FROM
    depends_on:
      auth-postgres:
        condition: service_healthy
  auth-postgres:
    image: postgres:15-alpine
    ports:
      - "${AUTH_DATABASE_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_DB=auth
      - POSTGRES_PASSWORD=${AUTH_DATABASE_PASSWORD:-replace-with-local-database-password}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
  shortlid-server:
    build:
      context: .
      dockerfile: apps/shortlid-server/Dockerfile
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
  shortlid-web:
    build:
      context: .
      dockerfile: apps/shortlid-web/Dockerfile
      args:
        - SERVER=http://localhost:3333
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - shortlid-server
  redis:
    image: redis:7.2-alpine
    container_name: redis-local-secure
    restart: always
    ports:
      - "6380:6380"
    volumes:
      - ./configs/certs:/certs:ro
      - ./configs/users.acl:/etc/redis/users.acl:ro
    command: >
      redis-server 
      --tls-port 6380
      --port 0 
      --tls-cert-file /certs/redis.crt 
      --tls-key-file /certs/redis.key 
      --tls-ca-cert-file /certs/redis.crt 
      --tls-auth-clients no 
      --aclfile /etc/redis/users.acl 
      --appendonly yes

networks:
  default:
    driver: bridge

volumes:
  auth-postgres-data:
